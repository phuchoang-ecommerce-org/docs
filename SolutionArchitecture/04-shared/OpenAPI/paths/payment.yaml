# Payment (`PAY`) — path items
#
# No operation in this file accepts or returns a payment instrument.

orderPaymentMethods:
  parameters:
    - $ref: '../components/parameters.yaml#/OrderId'
  get:
    operationId: listEligiblePaymentMethods
    tags: [Payment]
    summary: List the payment methods eligible for an order
    description: >-
      Eligibility is computed per order, not read from a static list: Cash On
      Delivery depends on destination and order value (`FR-PAY-01`, `FR-PAY-02`,
      `BR-PAY-03`). Ineligible methods are returned **with a reason** rather than
      omitted, so a client can explain the exclusion instead of silently hiding
      it.
    x-ecp-roles: [CUSTOMER, CUSTOMER_SUPPORT, ADMINISTRATOR]
    x-ecp-ownership: own
    x-ecp-traces:
      uc: [UC-PAY-01]
      fr: [FR-PAY-01, FR-PAY-02]
      br: [BR-PAY-03]
    parameters:
      - $ref: '../components/parameters.yaml#/CorrelationIdHeader'
    responses:
      '200':
        description: Eligible and ineligible methods.
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '../components/schemas/payment.yaml#/PaymentMethod' }
      '401': { $ref: '../components/responses.yaml#/Unauthenticated' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '429': { $ref: '../components/responses.yaml#/RateLimited' }

checkoutPaymentMethod:
  parameters:
    - $ref: '../components/parameters.yaml#/CheckoutId'
  put:
    operationId: selectCheckoutPaymentMethod
    tags: [Payment]
    summary: Select a payment method
    description: >-
      Records the chosen method on the Draft order. **Changing the selection
      re-evaluates eligibility** (`UC-PAY-01` A1) — a method that was eligible
      for an earlier basket may not be for the current one.
    x-ecp-roles: [CUSTOMER]
    x-ecp-ownership: own
    x-ecp-traces:
      uc: [UC-PAY-01]
      fr: [FR-PAY-01, FR-PAY-02]
      br: [BR-PAY-03]
    parameters:
      - $ref: '../components/parameters.yaml#/CorrelationIdHeader'
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/payment.yaml#/PaymentMethodSelection' }
    responses:
      '200':
        description: Method selected.
        content:
          application/json:
            schema: { $ref: '../components/schemas/ordering.yaml#/Checkout' }
      '400': { $ref: '../components/responses.yaml#/ValidationFailed' }
      '401': { $ref: '../components/responses.yaml#/Unauthenticated' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '422':
        description: The method is not eligible for this order (`BR-PAY-03`).
        content:
          application/problem+json:
            schema: { $ref: '../components/schemas/common.yaml#/Problem' }
      '429': { $ref: '../components/responses.yaml#/RateLimited' }

payments:
  post:
    operationId: initiatePayment
    tags: [Payment]
    summary: Initiate payment for an order
    description: |
      Authorises and captures payment for an order (`FR-PAY-03`, `FR-PAY-09`).

      **`Idempotency-Key` is required** — this is the second of exactly two
      operations that require it (`ADR-0003` §4, `Integration Contract` §2.2).
      A missing key is `400 ECP-ORD-4001`; the same key with a different body is
      `409 ECP-ORD-4090`; the same key with the same body returns the original
      response verbatim.

      A `PaymentAttempt` is recorded **before** the provider is contacted, so a
      provider timeout leaves the order in `PENDING_PAYMENT` with evidence of the
      attempt. **A timeout is never treated as a decline** (`UC-PAY-02` E2).

      An attempt already in flight for the order is `409 ECP-PAY-4090`
      (`BR-PAY-01`). Where the provider needs the customer to complete the
      payment interactively, the response is `202` with a `redirectUrl` and the
      outcome arrives later on the callback (`UC-PAY-03`).

      **No instrument crosses this boundary** (`NFR-SEC-07`). Targets
      p95 <= 800 ms excluding provider time (`NFR-PERF-02`).
    x-ecp-roles: [CUSTOMER]
    x-ecp-ownership: own
    x-ecp-traces:
      uc: [UC-PAY-02]
      fr: [FR-PAY-03, FR-PAY-09]
      br: [BR-PAY-01, BR-ORD-03]
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
      - $ref: '../components/parameters.yaml#/CorrelationIdHeader'
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/payment.yaml#/PaymentInitiation' }
    responses:
      '201':
        description: Payment captured synchronously.
        headers:
          Location: { $ref: '../components/headers.yaml#/Location' }
        content:
          application/json:
            schema: { $ref: '../components/schemas/payment.yaml#/PaymentInitiationResult' }
      '202':
        description: >-
          Accepted. The customer must complete the payment at `redirectUrl`; the
          outcome arrives asynchronously on the provider callback.
        headers:
          Location: { $ref: '../components/headers.yaml#/Location' }
        content:
          application/json:
            schema: { $ref: '../components/schemas/payment.yaml#/PaymentInitiationResult' }
      '400': { $ref: '../components/responses.yaml#/IdempotencyKeyMissing' }
      '401': { $ref: '../components/responses.yaml#/Unauthenticated' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/PaymentAlreadyInFlight' }
      '429': { $ref: '../components/responses.yaml#/RateLimited' }
      '503': { $ref: '../components/responses.yaml#/DependencyUnavailable' }

orderPayments:
  parameters:
    - $ref: '../components/parameters.yaml#/OrderId'
  get:
    operationId: getOrderPayment
    tags: [Payment]
    summary: Get an order's payment
    description: >-
      There is exactly one payment per order (`Database.md` §4.6). Payment state
      is strongly consistent and never served from a cache (`NFR-PERF-06`).
    x-ecp-roles: [CUSTOMER, CUSTOMER_SUPPORT, ADMINISTRATOR]
    x-ecp-ownership: own
    x-ecp-traces:
      uc: [UC-PAY-02, UC-ORD-06]
      fr: [FR-PAY-04]
      br: [BR-PAY-01]
    parameters:
      - $ref: '../components/parameters.yaml#/CorrelationIdHeader'
    responses:
      '200':
        description: The order's payment.
        content:
          application/json:
            schema: { $ref: '../components/schemas/payment.yaml#/Payment' }
      '401': { $ref: '../components/responses.yaml#/Unauthenticated' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '429': { $ref: '../components/responses.yaml#/RateLimited' }

paymentById:
  parameters:
    - $ref: '../components/parameters.yaml#/PaymentId'
  get:
    operationId: getPayment
    tags: [Payment]
    summary: Get one payment
    description: 'A payment the caller does not own returns `404`, never `403` (`Integration Contract` §2.1).'
    x-ecp-roles: [CUSTOMER, CUSTOMER_SUPPORT, ADMINISTRATOR]
    x-ecp-ownership: own
    x-ecp-traces:
      uc: [UC-PAY-02]
      fr: [FR-PAY-04]
      br: []
    parameters:
      - $ref: '../components/parameters.yaml#/CorrelationIdHeader'
    responses:
      '200':
        description: The payment.
        content:
          application/json:
            schema: { $ref: '../components/schemas/payment.yaml#/Payment' }
      '401': { $ref: '../components/responses.yaml#/Unauthenticated' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '429': { $ref: '../components/responses.yaml#/RateLimited' }

paymentAttempts:
  parameters:
    - $ref: '../components/parameters.yaml#/PaymentId'
  get:
    operationId: listPaymentAttempts
    tags: [Payment]
    summary: List a payment's attempts
    description: 'Every attempt, including failed and timed-out ones (`FR-PAY-04`).'
    x-ecp-roles: [CUSTOMER, CUSTOMER_SUPPORT, ADMINISTRATOR]
    x-ecp-ownership: own
    x-ecp-traces:
      uc: [UC-PAY-02, UC-PAY-05]
      fr: [FR-PAY-04]
      br: [BR-PAY-01]
    parameters:
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/PageSize'
      - $ref: '../components/parameters.yaml#/CorrelationIdHeader'
    responses:
      '200':
        description: The payment's attempts.
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/PageEnvelope'
                - type: object
                  properties:
                    items:
                      type: array
                      items: { $ref: '../components/schemas/payment.yaml#/PaymentAttempt' }
      '401': { $ref: '../components/responses.yaml#/Unauthenticated' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '429': { $ref: '../components/responses.yaml#/RateLimited' }
  post:
    operationId: retryPayment
    tags: [Payment]
    summary: Retry a failed payment
    description: |
      Starts a new attempt with a new provider reference (`FR-PAY-06`,
      `UC-PAY-05`). Permitted only within the retry window — 24 hours, during
      which the stock reservation is held (`A-07`, `BR-ORD-04`); after it the
      order is cancelled and stock released.

      **The total is not recalculated on retry** (`UC-PAY-05`): the customer is
      paying for the order they placed, at the prices frozen then (`BR-ORD-06`).
      The method may be changed. Further retries are rate-limited
      (`NFR-SEC-05`).
    x-ecp-roles: [CUSTOMER]
    x-ecp-ownership: own
    x-ecp-traces:
      uc: [UC-PAY-05]
      fr: [FR-PAY-06]
      br: [BR-ORD-04, BR-ORD-06, BR-PAY-01]
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
      - $ref: '../components/parameters.yaml#/CorrelationIdHeader'
    requestBody:
      required: false
      content:
        application/json:
          schema: { $ref: '../components/schemas/payment.yaml#/PaymentMethodSelection' }
    responses:
      '201':
        description: New attempt captured.
        headers:
          Location: { $ref: '../components/headers.yaml#/Location' }
        content:
          application/json:
            schema: { $ref: '../components/schemas/payment.yaml#/PaymentInitiationResult' }
      '202':
        description: Accepted; the customer must complete the payment interactively.
        content:
          application/json:
            schema: { $ref: '../components/schemas/payment.yaml#/PaymentInitiationResult' }
      '400': { $ref: '../components/responses.yaml#/IdempotencyKeyMissing' }
      '401': { $ref: '../components/responses.yaml#/Unauthenticated' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/PaymentAlreadyInFlight' }
      '422':
        description: The retry window has closed (`A-07`, `BR-ORD-04`).
        content:
          application/problem+json:
            schema: { $ref: '../components/schemas/common.yaml#/Problem' }
      '429': { $ref: '../components/responses.yaml#/RateLimited' }

paymentRefunds:
  parameters:
    - $ref: '../components/parameters.yaml#/PaymentId'
  get:
    operationId: listPaymentRefunds
    tags: [Payment]
    summary: List a payment's refunds
    x-ecp-roles: [CUSTOMER, CUSTOMER_SUPPORT, ADMINISTRATOR]
    x-ecp-ownership: own
    x-ecp-traces:
      uc: [UC-PAY-06]
      fr: [FR-PAY-08]
      br: [BR-PAY-02]
    description: 'Every refund against this payment (`FR-PAY-08`).'
    parameters:
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/PageSize'
      - $ref: '../components/parameters.yaml#/CorrelationIdHeader'
    responses:
      '200':
        description: The payment's refunds.
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/PageEnvelope'
                - type: object
                  properties:
                    items:
                      type: array
                      items: { $ref: '../components/schemas/payment.yaml#/Refund' }
      '401': { $ref: '../components/responses.yaml#/Unauthenticated' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '429': { $ref: '../components/responses.yaml#/RateLimited' }
  post:
    operationId: refundPayment
    tags: [Payment]
    summary: Refund a payment
    description: >-
      Full or partial refund with a mandatory reason (`FR-PAY-08`,
      `UC-PAY-06`). The refund is recorded **before** the provider is called, so
      a provider failure leaves something to reconcile against rather than
      nothing.

      A refund exceeding the cumulative captured amount is
      `422 ECP-PAY-4220` (`BR-PAY-02`) — an exact decimal comparison, never a
      floating-point one (`Database.md` §2.2).
    x-ecp-roles: [CUSTOMER_SUPPORT, ADMINISTRATOR]
    x-ecp-traces:
      uc: [UC-PAY-06]
      fr: [FR-PAY-08, FR-AUD-02]
      br: [BR-PAY-02, BR-AUD-01]
    parameters:
      - $ref: '../components/parameters.yaml#/CorrelationIdHeader'
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/payment.yaml#/RefundWrite' }
    responses:
      '201':
        description: Refund recorded and submitted to the provider.
        headers:
          Location: { $ref: '../components/headers.yaml#/Location' }
        content:
          application/json:
            schema: { $ref: '../components/schemas/payment.yaml#/Refund' }
      '400': { $ref: '../components/responses.yaml#/ValidationFailed' }
      '401': { $ref: '../components/responses.yaml#/Unauthenticated' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '422': { $ref: '../components/responses.yaml#/RefundExceedsCaptured' }
      '429': { $ref: '../components/responses.yaml#/RateLimited' }
      '503': { $ref: '../components/responses.yaml#/DependencyUnavailable' }

paymentCashCollections:
  parameters:
    - $ref: '../components/parameters.yaml#/PaymentId'
  post:
    operationId: settleCashOnDelivery
    tags: [Payment]
    summary: Record Cash On Delivery collection
    description: >-
      Records the amount collected and the collecting party (`FR-PAY-07`,
      `UC-PAY-04`). **An amount that does not match the order total records what
      was collected and does not mark the order paid** (`UC-PAY-04` E1):
      reconciling a shortfall is a human decision, not something the platform
      rounds away.
    x-ecp-roles: [WAREHOUSE_OPERATOR, ADMINISTRATOR]
    x-ecp-traces:
      uc: [UC-PAY-04]
      fr: [FR-PAY-07]
      br: [BR-PAY-03]
    parameters:
      - $ref: '../components/parameters.yaml#/CorrelationIdHeader'
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/payment.yaml#/CashCollection' }
    responses:
      '200':
        description: >-
          Collection recorded. The payment is `CAPTURED` only where the amount
          matched.
        content:
          application/json:
            schema: { $ref: '../components/schemas/payment.yaml#/Payment' }
      '400': { $ref: '../components/responses.yaml#/ValidationFailed' }
      '401': { $ref: '../components/responses.yaml#/Unauthenticated' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '429': { $ref: '../components/responses.yaml#/RateLimited' }

paymentProviderNotifications:
  post:
    operationId: receivePaymentProviderNotification
    tags: [Payment]
    summary: Receive a payment provider callback
    description: |
      Inbound callback carrying authorisation, capture, refund, and asynchronous
      settlement outcomes (`FR-PAY-04`, `FR-PAY-05`, `UC-PAY-03`).

      **Signature verification is a precondition of processing**: an unverifiable
      callback is recorded and rejected with `401`, never applied.

      **Applied at most once per attempt**, however many times the provider
      delivers it, keyed on `providerEventId` (`BR-PAY-01`, `NFR-REL-04`). A
      duplicate is acknowledged with `202`, not rejected — rejecting it would
      make a well-behaved provider retry forever.

      A result that cannot be correlated to an order is **recorded rather than
      discarded** and appears in the unmatched-payment queue (`UC-PAY-03` E3).
      A result that contradicts one already applied is escalated, never
      overwritten (`UC-PAY-03` E4).
    security:
      - providerSignature: []
    x-ecp-roles: []
    x-ecp-actor: Payment Gateway
    x-ecp-traces:
      uc: [UC-PAY-03]
      fr: [FR-PAY-04, FR-PAY-05]
      br: [BR-PAY-01]
    parameters:
      - $ref: '../components/parameters.yaml#/CorrelationIdHeader'
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/payment.yaml#/ProviderNotification' }
    responses:
      '202':
        description: >-
          Accepted, or already applied. A duplicate delivery returns this rather
          than an error.
      '400': { $ref: '../components/responses.yaml#/ValidationFailed' }
      '401':
        description: The signature could not be verified. The callback was recorded and not applied.
        content:
          application/problem+json:
            schema: { $ref: '../components/schemas/common.yaml#/Problem' }
      '429': { $ref: '../components/responses.yaml#/RateLimited' }

unmatchedPayments:
  get:
    operationId: listUnmatchedPayments
    tags: [Payment]
    summary: List provider results that could not be matched to an order
    description: >-
      The reconciliation queue (`UC-PAY-03` E3). A refund may be issued against
      an unmatched capture rather than against an order (`UC-PAY-06` A2).
    x-ecp-roles: [CUSTOMER_SUPPORT, ADMINISTRATOR]
    x-ecp-traces:
      uc: [UC-PAY-03, UC-PAY-06]
      fr: [FR-PAY-05, FR-PAY-08]
      br: [BR-PAY-01]
    parameters:
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/PageSize'
      - $ref: '../components/parameters.yaml#/CorrelationIdHeader'
      - name: resolved
        in: query
        required: false
        schema: { type: boolean }
    responses:
      '200':
        description: Unmatched provider results.
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/PageEnvelope'
                - type: object
                  properties:
                    items:
                      type: array
                      items: { $ref: '../components/schemas/payment.yaml#/UnmatchedPayment' }
      '400': { $ref: '../components/responses.yaml#/ValidationFailed' }
      '401': { $ref: '../components/responses.yaml#/Unauthenticated' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '429': { $ref: '../components/responses.yaml#/RateLimited' }
