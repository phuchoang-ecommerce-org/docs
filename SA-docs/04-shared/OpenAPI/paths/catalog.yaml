      per-item results rather than a single status, because a partial success is
      the expected case.
    x-ecp-roles: [STAFF, ADMINISTRATOR]
    x-ecp-traces:
      uc: [UC-ADM-01]
      fr: [FR-ADM-01]
      br: [BR-CAT-01]
