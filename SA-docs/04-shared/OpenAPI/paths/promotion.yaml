    operationId: generatePromotionVouchers
    tags: [Promotion]
    summary: Generate voucher codes
    description: 'Single-use or shared codes for a promotion (`FR-PRM-07`).'
    x-ecp-roles: [STAFF, ADMINISTRATOR]
    x-ecp-traces:
      uc: [UC-PRM-01]
      fr: [FR-PRM-07]
      br: [BR-PRM-01]
    parameters:
      - $ref: '../components/parameters.yaml#/CorrelationIdHeader'
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/promotion.yaml#/VoucherBatch' }
    responses:
      '201':
        description: Codes generated.
        headers:
          Location: { $ref: '../components/headers.yaml#/Location' }
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '../components/schemas/promotion.yaml#/Voucher' }
      '400': { $ref: '../components/responses.yaml#/ValidationFailed' }
      '401': { $ref: '../components/responses.yaml#/Unauthenticated' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '429': { $ref: '../components/responses.yaml#/RateLimited' }

promotionRedemptions:
  parameters:
    - $ref: '../components/parameters.yaml#/PromotionId'
  get:
    operationId: listPromotionRedemptions
    tags: [Promotion]
    summary: List a promotion's redemptions
    description: >-
      Who redeemed, against which order, for how much — the exposure figure
      behind `usageCount` (`FR-PRM-09`).
    x-ecp-roles: [STAFF, CUSTOMER_SUPPORT, ADMINISTRATOR]
    x-ecp-traces:
      uc: [UC-PRM-03]
      fr: [FR-PRM-09]
      br: [BR-PRM-01]
    parameters:
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/PageSize'
      - $ref: '../components/parameters.yaml#/CorrelationIdHeader'
    responses:
      '200':
        description: Redemptions.
        content:
          application/json:
            schema: { $ref: '../components/schemas/promotion.yaml#/RedemptionPage' }
      '401': { $ref: '../components/responses.yaml#/Unauthenticated' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '429': { $ref: '../components/responses.yaml#/RateLimited' }

voucherValidations:
  post:
    operationId: validateVoucher
    tags: [Promotion]
    summary: Validate a voucher code
    description: |
      Reports whether a code is valid and what discount it would produce
      (`FR-PRM-08`, `UC-PRM-02`).

      **A rejection is deliberately non-disclosive**: unrecognised, expired, and
      exhausted codes return the same `valid: false` with no distinguishing
      detail. This endpoint is an enumeration surface, so it carries a stricter,
      **fail-closed** rate limit alongside login, registration and password reset
      (`NFR-SEC-05`, `UC-AUD-04` A1).

      A `POST` rather than a `GET` because the code is a credential-like secret
      that does not belong in a URL, a log, or a browser history.

      The discount reported is a **preview**, not a reservation
      (`Domain Model` §5.2).
    x-ecp-roles: [CUSTOMER]
    x-ecp-traces:
      uc: [UC-PRM-02]
      fr: [FR-PRM-08]
      br: [BR-PRM-01]
    parameters:
      - $ref: '../components/parameters.yaml#/CorrelationIdHeader'
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/promotion.yaml#/VoucherValidationRequest' }
    responses:
      '200':
        description: >-
          The validation outcome. `valid: false` is a successful response, not an
          error: the code was evaluated.
        content:
          application/json:
            schema: { $ref: '../components/schemas/promotion.yaml#/VoucherValidationResult' }
      '400': { $ref: '../components/responses.yaml#/ValidationFailed' }
      '401': { $ref: '../components/responses.yaml#/Unauthenticated' }
      '429': { $ref: '../components/responses.yaml#/RateLimited' }
