openapi: 3.1.0

info:
  title: Enterprise Commerce Platform API
  version: 1.0.0
  summary: The single REST/JSON API every ECP client class uses.
  description: |
    The client-facing contract for the Enterprise Commerce Platform (ECP).

    **One API serves every client class** — web storefront, admin console, and
    the future mobile application (SRS §8). A new client is a new *caller*, never
    a new place rules are re-implemented (`P5`). Authorisation is applied once,
    at the API/application boundary, and never assumed by a client
    (`ADR-0003` §4, `ADR-0016`).

    ## Status

    **Proposed.** This document is hand-authored, contract-first, under
    [`ADR-0031`](../../01-system/ADR/ADR-0031-contract-first-openapi.md), which
    supersedes the `Contract` row of [`ADR-0003`](../../01-system/ADR/ADR-0003-rest-api-style.md)
    §4. It is normative until the controller layer exists, at which point CI
    diffs the generated document against it and fails the build on divergence.
    See `README.md`.

    ## What is normative elsewhere

    Every rule this document encodes comes from
    [`Integration Contract.md`](../Integration%20Contract.md). Where the two
    disagree, the Integration Contract is right and this document is stale.

    | Concern | Source |
    |---|---|
    | REST conventions, verbs, status codes | Integration Contract §2, §2.1 |
    | Idempotency | Integration Contract §2.2, ADR-0003 §4 |
    | Pagination, filtering, sorting | Integration Contract §3 |
    | Error taxonomy | Integration Contract §4 |
    | Authentication and authorisation | Integration Contract §5, ADR-0016, ADR-0025 |
    | Schema evolution | Integration Contract §8 |
    | Permission matrix | Integration Contract §9, SRS §2.3 (normative) |

    ## Conventions that apply to every operation

    - **Money is always an object**, never a bare number, and its `amount` is a
      **string** so no client's JSON parser can turn it into a float.
    - **Identifiers are opaque.** A client never parses, orders, or infers
      meaning from one.
    - **Every collection is paginated**, by cursor and never by offset. There is
      no unpaginated list endpoint.
    - **Every 4xx and 5xx carries a `code`** in an RFC 9457
      `application/problem+json` body. There is no bare status-code error.
    - **Status enums are open.** Adding a value is a non-breaking change
      precisely because clients must tolerate unknown values, so status fields
      are typed `string` with `x-extensible-enum` rather than a closed `enum`.
    - **A resource the caller does not own returns `404`, not `403`** —
      returning `403` would confirm it exists.
    - **An unknown query parameter is `400`**, never silently ignored.
    - Which store answers a query — PostgreSQL, Elasticsearch, MongoDB, or Redis
      — never appears in a URI or a response.

    ## Vendor extensions

    | Extension | Meaning |
    |---|---|
    | `x-ecp-roles` | The roles permitted to call this operation, from the Integration Contract §9 permission matrix. Empty for a provider callback, which is authenticated by signature rather than by role. |
    | `x-ecp-ownership` | `own` where the role grants the *capability* and a runtime ownership check grants the *instance*. |
    | `x-ecp-traces` | The `UC`/`FR`/`BR` identifiers this operation realises. `UC-<D>-<nn>` and `US-<D>-<nn>` are the identity mapping, so citing the use case cites the user story too. |
    | `x-ecp-actor` | The external actor that calls an inbound provider callback. |
    | `x-extensible-enum` | The known values of an open vocabulary. Clients must tolerate values not listed. |
  contact:
    name: Solution Architecture
  license:
    name: Proprietary
    identifier: LicenseRef-ECP-Proprietary

servers:
  - url: '{protocol}://{host}/api/v1'
    description: >-
      Versioning is a URI path prefix — visible in logs, cacheable, trivially
      routable (`ADR-0003` §4). A breaking change ships as `/api/v2` served
      concurrently, and `v1` then carries a `Deprecation` header
      (`Integration Contract` §8.3).

      **[ASSUMPTION]** No document names a host. The variables below are
      placeholders to be set per environment.
    variables:
      protocol:
        default: https
        enum: [https]
        description: HTTPS only. The session cookie is never sent over plain HTTP (`NFR-SEC-06`).
      host:
        default: api.ecp.example
  - url: 'http://localhost:8080/api/v1'
    description: Local development (`Deployment Diagram` — local topology).

security:
  - bearerAuth: []
  - sessionCookie: []
    csrfToken: []

tags:
  - name: Customer & Identity
    description: >-
      Registration, verification, sessions, profile, and the address book
      (`CUS`, `UC-CUS-01`–`UC-CUS-10`).
  - name: Product Catalog & Category
    description: >-
      Products, variants, images, and the category tree, plus the staff
      operations that maintain them (`CAT`, `UC-CAT-01`–`UC-CAT-05`,
      `UC-ADM-01`, `UC-ADM-02`).
  - name: Search & Recommendation
    description: >-
      Keyword search, auto-complete, facets, keywords, and recommendations
      (`SCH`, `UC-SCH-01`–`UC-SCH-07`). Served by a read model inside Catalog;
      degrades rather than blocking browse or checkout (`NFR-AVAIL-02`).
  - name: Inventory
    description: >-
      Stock levels, adjustments, and reservation commitment (`INV`,
      `UC-INV-03`–`UC-INV-05`, `UC-ADM-05`). Reservation and release are
      in-process and have no endpoint.
  - name: Cart & Wishlist
    description: >-
      Guest and customer carts, merge-on-login, and the wishlist (`CRT`,
      `UC-CRT-01`–`UC-CRT-05`, `UC-CRT-07`, `UC-CRT-08`).
  - name: Checkout & Order
    description: >-
      Checkout, order placement, the order lifecycle, cancellation, and returns
      (`ORD`, `UC-ORD-01`–`UC-ORD-10`, `UC-ADM-04`, `UC-CUS-10`).
  - name: Payment
    description: >-
      Method eligibility, authorisation, provider callbacks, Cash On Delivery,
      retries, and refunds (`PAY`, `UC-PAY-01`–`UC-PAY-06`). No operation here
      accepts or returns a payment instrument.
  - name: Shipping
    description: >-
      Quotes, shipments, carrier tracking, and delivery confirmation (`SHP`,
      `UC-SHP-01`–`UC-SHP-06`).
  - name: Promotion
    description: >-
      Promotions, vouchers, flash sales, and redemptions (`PRM`,
      `UC-PRM-01`–`UC-PRM-05`).
  - name: Review
    description: >-
      Submission by verified buyers, editing, reporting, and moderation (`REV`,
      `UC-REV-01`–`UC-REV-05`).
  - name: Notification
    description: >-
      The in-app inbox, preferences, and delivery outcomes (`NTF`, `UC-NTF-03`,
      `UC-NTF-04`). Delivery itself is event-driven and has no endpoint.
  - name: Administration
    description: >-
      Account administration and role management (`ADM`, `UC-ADM-03`,
      `UC-ADM-06`). The other `ADM` use cases live on the resources they act on.
  - name: Reporting & Analytics
    description: >-
      Revenue, product, customer, inventory, and conversion reporting, plus
      exports (`RPT`, `UC-RPT-01`–`UC-RPT-06`). Figures may lag transactional
      state by up to 5 minutes (`A-11`).
  - name: Audit & Access Control
    description: >-
      Read-only search of the append-only audit trail (`AUD`, `UC-AUD-02`).
      No role may amend it through any interface.

